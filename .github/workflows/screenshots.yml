name: Screenshot Monitor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Crear entorno Puppeteer aislado
        run: |
          mkdir /tmp/puppeteer-runner
          cd /tmp/puppeteer-runner
          npm init -y
          npm install puppeteer --legacy-peer-deps

      - name: Verificar instalación
        run: |
          export NODE_PATH=/tmp/puppeteer-runner/node_modules
          node -e "console.log(require.resolve('puppeteer'))"

      - name: Ejecutar screenshots
        run: |
          export NODE_PATH=/tmp/puppeteer-runner/node_modules
          node screenshots.js

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: screenshots/